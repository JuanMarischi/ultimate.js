<!DOCTYPE html>
<head>
    <title>Ingreso de Usuario</title>
</head>
<body>
<p>Ingresa tu nombre</p>
<input type="text" id="nombreDeUsuario">
<button onclick="mostrarNombre()">Ingresaar</button>
<h1 id="salida">No se tu nombre</h1>

<script>
function mostrarNombre(){
    let elementoNombre = document.getElementById("nombreDeUsuario"); //lo campturas poniendo get element y lo que quieras ingresar
    let elementoTexto = document.getElementById("salida");
    let mensaje =  "Tu te llamas " + elementoNombre.value;
    
    
    elementoTexto.textContent = mensaje;


}
</script>

</body>
</html>



<!DOCTYPE html>; 
<head>
    <title>Ingresos de usuario 1</title>
</head>
<body>
    <input type="text" id="inputTexto" value="Este es un mensaje">
    <button onclick="mostrarTexto()">Click aqui</button>
    <h1 id="titulo"></h1>

    <script>
    function mostrarTexto (){
        var input = document.getElementById("inputTexto"); // tomar el input
        var titulo = document.getElementById("titulo");    // tomar el h1

        let mensaje = "Este es un mensaje " + input.value; // usar .value del input
        
        titulo.textContent = mensaje; // mostrar en el h1
    }
    </script>
</body>
</html>
